<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Luxurious Atelier Dark Slate Backdrop -->
  <rect width="100" height="100" rx="22" fill="#0D0C0A"/>
  
  <!-- Subtle Amber Rim Aura -->
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="#C5A059" stroke-width="1.2" stroke-opacity="0.3"/>
  
  <!-- Eye of Horus Icon Mark in Signature Aurora Gold (#C5A059) -->
  <g stroke="#C5A059" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Eyebrow -->
    <path d="M 18 26 C 36 17 64 17 82 26" stroke-width="3.2" />
    
    <!-- Upper Eyelid -->
    <path d="M 18 38 C 36 27 64 27 82 38" stroke-width="3.2" />
    
    <!-- Lower Eyelid -->
    <path d="M 22 40 C 38 52 62 52 78 40" stroke-width="3.2" />
    
    <!-- Solid Pupil -->
    <circle cx="50" cy="38.5" r="6.5" fill="#C5A059" stroke="none" />
    
    <!-- Sweeping Cheek Line -->
    <path d="M 23 43 C 38 60 58 74 80 68" stroke-width="3.2" />
    
    <!-- Falcon Spiral Coil -->
    <path d="M 66 46 C 72 58 75 68 70 76 C 62 82 56 72 62 66" stroke-width="2.6" />
  </g>
</svg>
