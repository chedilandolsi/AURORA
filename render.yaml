# ==============================================================================
# Aurora Artisanal E-Commerce - Render Blueprint Specification (render.yaml)
# Production Containerized Deployment for Spring Boot 3 Backend
# ==============================================================================

services:
  - type: web
    name: aurora-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt # Lowest latency to Europe and North Africa
    healthCheckPath: /swagger-ui.html
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:+UseSerialGC -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
      - key: DATABASE_URL
        sync: false # Set in Render dashboard: Supabase Transaction Pooler URL
      - key: JWT_SECRET
        sync: false # Generate 256-bit Base64 secret
      - key: STRIPE_SECRET_KEY
        sync: false # Stripe Secret API key
      - key: STRIPE_PUBLISHABLE_KEY
        value: pk_test_51Svihe2NdpBINd1ktWM9fklCXX5QgvBdQbSXM8MMNDhxlNSh8yPaSejOa9A4XZhizTVzOgQcakwcoH7SlDi3rmcO00wl78iV37
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # Webhook secret from Stripe dashboard
      - key: WISE_PAYOUT_ACCOUNT
        value: chedi-wise-eur-artisanal-account
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://aurora-masks.tn,https://aurora.vercel.app
      - key: CLIENT_URL
        sync: false # e.g. https://aurora-masks.tn
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
