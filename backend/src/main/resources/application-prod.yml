server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    remote-ip-header: x-forwarded-for
    protocol-header: x-forwarded-proto
    internal-proxies: ".*"
  servlet:
    context-path: /

spring:
  config:
    activate:
      on-profile: prod
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: https://aurora-backend-s66d.onrender.com/login/oauth2/code/google
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/aurora_db}}
    username: ${SPRING_DATASOURCE_USERNAME:aurora_user}
    password: ${SPRING_DATASOURCE_PASSWORD:aurora_secure_password_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AuroraProdHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      leak-detection-threshold: 60000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
  flyway:
    enabled: false

logging:
  level:
    root: INFO
    com.aurora: INFO
    org.springframework.security: INFO
    org.hibernate: ERROR

stripe:
  api-key: ${STRIPE_SECRET_KEY:${STRIPE_API_KEY}}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_live_51URVOHPpyNLcFUhiQzUYHWqflSp4COOueDYxYWORVPPxdvwRBRj1KD74H1I3x0ynNgWN8gDLeDR4MzfXPH0OHunT00c2nMlAs9}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  success-url: ${STRIPE_SUCCESS_URL:https://aurora-creation-atelier.vercel.app/checkout/success?session_id={CHECKOUT_SESSION_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:https://aurora-creation-atelier.vercel.app/cart}

