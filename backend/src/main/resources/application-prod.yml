server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/aurora_db}}
    username: ${SPRING_DATASOURCE_USERNAME:aurora_user}
    password: ${SPRING_DATASOURCE_PASSWORD:aurora_secure_password_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AuroraProdHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      leak-detection-threshold: 60000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
  flyway:
    enabled: false

logging:
  level:
    root: INFO
    com.aurora: INFO
    org.springframework.security: WARN
    org.hibernate: ERROR
