server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: aurora-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aurora_db}
    username: ${SPRING_DATASOURCE_USERNAME:aurora_user}
    password: ${SPRING_DATASOURCE_PASSWORD:aurora_secure_password_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AuroraHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
              - openid
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1hdXJvcmEtand0LXNpZ25pbmcta2V5LWZvci1wcm9kdWN0aW9uLW1vZGVsLTI1Ni1iaXQ=}
    expiration-ms: 86400000 # 24 hours standard
    remember-me-expiration-ms: 2592000000 # 30 days extended session
  upload:
    dir: ${UPLOAD_DIR:uploads/products}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:8080}
  client:
    url: ${CLIENT_URL:http://localhost:4200}
  mail:
    from: ${APP_MAIL_FROM:atelier@aurora-masks.tn}
    brand-name: "AURORA Atelier"

stripe:
  api-key: ${STRIPE_SECRET_KEY:${STRIPE_API_KEY:sk_test_placeholder_key}}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_placeholder_key}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder_secret}
  currency:
    default: eur
    supported: eur,usd
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:4200/checkout/success?session_id={CHECKOUT_SESSION_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:4200/cart}
  payout:
    wise-account-recipient: ${WISE_PAYOUT_ACCOUNT:chedi-wise-eur-artisanal-account}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    root: INFO
    com.aurora: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
